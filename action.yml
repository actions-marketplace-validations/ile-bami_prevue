name: 'Preview URL'
description: 'Creates preview URLS for development.'
inputs:
  forwarded_port:
    description: 'The port to forward'
    required: true
  labels_json:
    description: 'The list of PR label names in JSON format'
    required: true
  codespaces_pat:
    description: 'The GitHub token (PAT) with codespaces write access'
    required: true
  pr_number:
    description: 'The pull request number'
    required: true
  label:
    description: 'The PR label name that triggers the preview environment'
    required: false
    default: 'preview-url'
branding:
  icon: 'monitor'
  color: 'black'

runs:
  using: 'composite'
  steps:
    - name: Create Codespace
      if: ${{ contains(fromJSON(inputs.labels_json), inputs.label) }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.codespaces_pat }}
        PR_NUMBER: ${{ inputs.pr_number }}
        FORWARDED_PORT: ${{ inputs.forwarded_port }}
      run: |
        set -uo pipefail

        BRANCH="${GITHUB_HEAD_REF}"
        OWNER="${GITHUB_REPOSITORY%%/*}"
        REPO="${GITHUB_REPOSITORY#*/}"

        echo "Logging in..."

        echo "${GH_TOKEN}" | gh auth login --with-token

        echo "Creating codespace for ${OWNER}/${REPO} on branch ${BRANCH}..."

        gh codespace create \
          --repo "${OWNER}/${REPO}" \
          --branch "${BRANCH}" \
          --devcontainer-path ".devcontainer/devcontainer.json" \
          --machine basicLinux32gb

        if [ $? -eq 0 ]; then
          CODESPACE_NAME="$(gh codespace list --repo "${OWNER}/${REPO}" --limit 100 --json repository,name,gitStatus --jq ".[] | select(((if .repository | type == \"object\" then .repository.fullName else .repository end) == \"${OWNER}/${REPO}\") and (.gitStatus | type == \"object\" and (.ref == \"refs/heads/${BRANCH}\" or .ref == \"${BRANCH}\"))) | .name")"
          echo "Newest codespace name: ${CODESPACE_NAME}"

          gh codespace ports visibility --codespace "${CODESPACE_NAME}" ${FORWARDED_PORT}:public

          FORWARDED_URL="https://${CODESPACE_NAME}-${FORWARDED_PORT}.app.github.dev"

          cat <<< "
          ## ✅ Preview Codespace Ready
          | | |
          |---|---|
          | **Branch** | \`${BRANCH}\` |
          | **Codespace** | \`${CODESPACE_NAME}\` |
          | **URL** | [Open Preview](${FORWARDED_URL}) |
          " | sed 's/^          //' | gh pr comment "${PR_NUMBER}" --repo "${OWNER}/${REPO}" -F-
        else
          BODY="
          ## ❌ Codespace Creation Failed
          The codespace for branch \`${BRANCH}\` could not be created.
          "
          gh pr comment "${PR_NUMBER}" --repo "${OWNER}/${REPO}" --body "${BODY}"
          exit 1
        fi

    - name: Delete Codespace
      if: ${{ !contains(fromJSON(inputs.labels_json), inputs.label) }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.codespaces_pat }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        set -uo pipefail

        BRANCH="${GITHUB_HEAD_REF}"
        OWNER="${GITHUB_REPOSITORY%%/*}"
        REPO="${GITHUB_REPOSITORY#*/}"

        echo "Checking for existing codespace for ${OWNER}/${REPO} on branch ${BRANCH}..."

        CODESPACE_NAME="$(gh codespace list --repo "${OWNER}/${REPO}" --limit 100 --json repository,name,gitStatus --jq ".[] | select(((if .repository | type == \"object\" then .repository.fullName else .repository end) == \"${OWNER}/${REPO}\") and (.gitStatus | type == \"object\" and (.ref == \"refs/heads/${BRANCH}\" or .ref == \"${BRANCH}\"))) | .name")"

        if [ -n "${CODESPACE_NAME}" ]; then
          echo "Found codespace(s) to delete:"
          echo "${CODESPACE_NAME}"
          echo "${CODESPACE_NAME}" | while read -r name; do
            if [ -n "${name}" ]; then
              echo "Deleting codespace: ${name}..."
              gh codespace delete --codespace "${name}" --force
            fi
          done

          gh pr comment "${PR_NUMBER}" --repo "${OWNER}/${REPO}" --body "## 🗑️ Preview Codespace Deleted

          The preview codespace for branch \`${BRANCH}\` has been deleted."
        else
          echo "No codespace found to delete."
        fi
